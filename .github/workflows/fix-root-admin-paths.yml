name: Fix root admin asset paths

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-paths:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Normalize root HTML relative paths
        shell: python
        run: |
          from pathlib import Path
          import re

          for path in Path('.').glob('*.html'):
              text = path.read_text(encoding='utf-8')
              updated = re.sub(r'((?:href|src)\s*=\s*["\'])\.\./', r'\1', text)
              if updated != text:
                  path.write_text(updated, encoding='utf-8')

      - name: Commit fixes when needed
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No path fixes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html'
          git commit -m "Fix root admin HTML relative paths"
          git push